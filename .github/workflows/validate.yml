name: Validate

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline tests
        run: python3 tests/test_helpers.py
      - name: Compile Mystic script
        run: python3 -c "from pathlib import Path; compile(Path('aminetdoor.mpy').read_text(encoding='utf-8'), 'aminetdoor.mpy', 'exec')"
      - name: Check tracked Python artifacts
        run: test -z "$(git ls-files | grep -E '(^|/)(__pycache__/|[^/]+\.py[co]$)' || true)"
